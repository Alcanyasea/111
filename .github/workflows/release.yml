name: build-installer

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build/attach installer for (e.g. v1.1.3)"
        required: false
        default: ""

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: gui/requirements.txt

      # 有 4 个 GUI 测试模块在顶层 import PySide6（stage_plan_dialog /
      # base_schedule_presets / ui_polish / console_ui_redesign），必须装 GUI 依赖
      - name: Install GUI dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r gui\requirements.txt

      - name: Run unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

  build:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    needs: test
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}".Trim()
          if (-not $tag) {
            if ($env:GITHUB_EVENT_NAME -eq 'push') { $tag = $env:GITHUB_REF_NAME }
            else { $tag = git describe --tags --abbrev=0 }
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "tag '$tag' 不符合 v*.*.* 格式（workflow_dispatch 手填时检查输入）"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: gui/requirements.txt

      - name: Cache build tools (7-Zip MSI / SFX module)
        uses: actions/cache@v6
        with:
          path: build\tools
          key: build-tools-7zip2409-sfx
          restore-keys: build-tools-7zip2409-sfx

      - name: Install GUI dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r gui\requirements.txt

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ steps.tag.outputs.tag }}" -replace '^v',''
          .\build\build_installer.ps1 `
            -Version $version `
            -RepoRoot (Get-Location) `
            -OutputDir (Join-Path (Get-Location) 'build\dist')

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: |
            build/**/*.log
            gui/debug/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Attach to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $exe = Get-ChildItem 'build\dist\*.exe' | Select-Object -First 1
          if (-not $exe) { throw "build\dist 下没有找到安装包 exe" }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title $tag --generate-notes
          }
          gh release upload $tag $exe.FullName --repo $env:GITHUB_REPOSITORY --clobber
