name: build-installer

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build/attach installer for (e.g. v1.1.3)"
        required: false
        default: ""

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}".Trim()
          if (-not $tag) {
            if ($env:GITHUB_EVENT_NAME -eq 'push') { $tag = $env:GITHUB_REF_NAME }
            else { $tag = git describe --tags --abbrev=0 }
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ steps.tag.outputs.tag }}" -replace '^v',''
          .\build\build_installer.ps1 `
            -Version $version `
            -RepoRoot (Get-Location) `
            -OutputDir (Join-Path (Get-Location) 'build\dist')

      - name: Attach to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $exe = Get-ChildItem 'build\dist\*.exe' | Select-Object -First 1
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title $tag --generate-notes
          }
          gh release upload $tag $exe.FullName --repo $env:GITHUB_REPOSITORY --clobber
