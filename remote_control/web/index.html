<!doctype html><html lang="zh-CN"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAA 远程控制</title><link rel="stylesheet" href="/styles.css"><main><h1>MAA 远程控制</h1><label>管理员密码<input id="password" type="password" autocomplete="current-password"></label><button id="login">登录</button><label>设备 ID<input id="device" list="devices" placeholder="例如 home-pc"><datalist id="devices"></datalist></label><pre id="snapshot">尚未读取状态</pre><section><button data-kind="run">立即运行</button><button data-kind="collect">基建收菜</button><button data-kind="stop">停止</button></section><label>配置补丁 JSON<textarea id="patch" placeholder='{"schedule":{"times":[]}}'></textarea></label><button id="save-patch">保存配置补丁</button><p id="status">请先登录。</p></main><script src="/app.js"></script>
